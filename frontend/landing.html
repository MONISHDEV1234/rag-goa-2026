<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SONAR</title>
  <meta name="theme-color" content="#00f0ff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@1,700;1,900&family=Orbitron:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: #000000;
      font-family: 'Chakra Petch', 'Orbitron', monospace;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Hero (centered) ── */
    .hero {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 0;
    }

    /* ══════════════════════════════════════
       CYBERPUNK 2077 LOGO TEXT STYLE
       - Aggressive forward slant / skew
       - Slashed horizontal split line
       - Razor sharp angular edges
       - Same cyan neon colors & glitch effects
    ══════════════════════════════════════ */
    .cyber-logo-wrap {
      position: relative;
      display: inline-block;
      transform: skewX(-15deg) rotate(-1deg);
      user-select: none;
      filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.6))
              drop-shadow(0 0 60px rgba(0, 240, 255, 0.3));
      animation: breathe 4s ease-in-out infinite;
      margin-bottom: 24px;
    }

    .sonar-cyber-text {
      position: relative;
      font-family: 'Chakra Petch', 'Orbitron', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: clamp(5.5rem, 22vw, 15rem);
      line-height: 0.95;
      letter-spacing: 0.08em;
      color: #00f0ff;
      text-transform: uppercase;
      display: block;
      /* Cyberpunk sliced cut: top & bottom separated with razor gap */
      clip-path: polygon(
        0% 0%,
        100% 0%,
        100% 43%,
        0% 48%,
        0% 52%,
        100% 47%,
        100% 100%,
        0% 100%
      );
      text-shadow:
        0 0 10px #00f0ff,
        0 0 25px #00f0ff,
        0 0 50px rgba(0,240,255,0.7);
    }

    /* Cyberpunk sharp underline / speed slash */
    .cyber-logo-wrap::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: -4%;
      width: 108%;
      height: 4px;
      background: #00f0ff;
      box-shadow: 0 0 12px #00f0ff, 0 0 25px rgba(0,240,255,0.8);
      clip-path: polygon(0 0, 100% 0, 92% 100%, 8% 100%);
    }

    /* Razor slash cut streak across middle */
    .cyber-logo-wrap::before {
      content: '';
      position: absolute;
      top: 48%;
      left: -8%;
      width: 116%;
      height: 2px;
      background: rgba(0, 240, 255, 0.8);
      box-shadow: 0 0 8px #00f0ff;
      transform: skewY(1.2deg);
      pointer-events: none;
      z-index: 5;
    }

    /* Chromatic glitch layers (Red/Magenta & Green) */
    .sonar-cyber-text::before,
    .sonar-cyber-text::after {
      content: 'SONAR';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      font-family: inherit;
      font-weight: inherit;
      font-style: inherit;
      font-size: inherit;
      letter-spacing: inherit;
    }
    .sonar-cyber-text::before {
      color: #ff2a6d;
      text-shadow: 0 0 15px #ff2a6d;
      clip-path: inset(20% 0 52% 0);
      animation: glitch-r 5s infinite;
      z-index: -1;
    }
    .sonar-cyber-text::after {
      color: #05ffa1;
      text-shadow: 0 0 15px #05ffa1;
      clip-path: inset(58% 0 10% 0);
      animation: glitch-g 5s infinite 0.35s;
      z-index: -1;
    }

    @keyframes breathe {
      0%,100% {
        filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.6))
                drop-shadow(0 0 60px rgba(0, 240, 255, 0.3));
      }
      50% {
        filter: drop-shadow(0 0 40px rgba(0, 240, 255, 0.9))
                drop-shadow(0 0 100px rgba(0, 240, 255, 0.5));
      }
    }

    @keyframes glitch-r {
      0%,84%,100% { opacity:0; transform:translate(0); }
      86% { opacity:1; transform:translateX(-8px) skewX(-2deg); }
      88% { opacity:1; transform:translateX(6px); }
      90% { opacity:0.7; transform:translateX(-4px); }
      92% { opacity:0; }
    }
    @keyframes glitch-g {
      0%,84%,100% { opacity:0; transform:translate(0); }
      87% { opacity:1; transform:translateX(8px) skewX(2deg); }
      89% { opacity:1; transform:translateX(-6px); }
      91% { opacity:0.7; transform:translateX(3px); }
      93% { opacity:0; }
    }

    /* ── Tagline ── */
    .tagline {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.65rem, 2vw, 0.88rem);
      letter-spacing: 0.35em;
      color: rgba(0,240,255,0.5);
      text-transform: uppercase;
      margin-top: 12px;
      margin-bottom: 48px;
    }
    .cursor {
      display: inline-block; width: 1ch;
      background: rgba(0,240,255,0.6);
      animation: cur 1s steps(1) infinite;
    }
    @keyframes cur { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Enter button (Cyberpunk cut-corner style) ── */
    .btn-enter {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 44px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.82rem; letter-spacing: 0.22em;
      font-weight: 700;
      color: #05050d;
      background: #00f0ff;
      text-decoration: none;
      clip-path: polygon(14px 0%, 100% 0%, calc(100% - 14px) 100%, 0% 100%);
      box-shadow: 0 0 20px #00f0ff, 0 0 50px rgba(0,240,255,0.4);
      transition: all 0.25s cubic-bezier(0.2,0,0,1);
      position: relative; overflow: hidden;
    }
    .btn-enter::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }
    .btn-enter:hover::before { transform: translateX(100%); }
    .btn-enter:hover {
      background: #33f5ff;
      box-shadow: 0 0 35px #00f0ff, 0 0 80px rgba(0,240,255,0.6);
      transform: translateY(-2px) scale(1.03);
    }
    .btn-enter:active { transform: translateY(0) scale(0.98); }

    /* ══════════════════════════════════════
       PAGE GLITCH STRIPS
    ══════════════════════════════════════ */
    .glitch-strip {
      position: fixed;
      left: -5%;
      width: 110%;
      pointer-events: none;
      z-index: 200;
      opacity: 0;
      backdrop-filter: invert(1) hue-rotate(160deg) saturate(3) brightness(1.4);
      -webkit-backdrop-filter: invert(1) hue-rotate(160deg) saturate(3) brightness(1.4);
      mix-blend-mode: screen;
    }

    .glitch-strip-1 {
      top: 32%;
      height: 22px;
      animation: strip1 4.5s infinite 0.8s;
    }
    .glitch-strip-2 {
      top: 61%;
      height: 13px;
      animation: strip2 4.5s infinite 2.1s;
    }

    @keyframes strip1 {
      0%,78%,100% {
        opacity: 0;
        transform: translateX(0) skewX(0deg);
      }
      79% {
        opacity: 1;
        transform: translateX(-40px) skewX(-2deg);
        height: 22px;
      }
      80% {
        opacity: 0.9;
        transform: translateX(60px) skewX(1.5deg);
        height: 28px;
      }
      81% {
        opacity: 1;
        transform: translateX(-25px) skewX(-1deg);
        height: 18px;
      }
      82% {
        opacity: 0.6;
        transform: translateX(80px) skewX(2deg);
        height: 22px;
      }
      83% {
        opacity: 0;
        transform: translateX(0);
      }
    }

    @keyframes strip2 {
      0%,72%,100% {
        opacity: 0;
        transform: translateX(0) skewX(0deg);
      }
      73% {
        opacity: 1;
        transform: translateX(55px) skewX(2deg);
        height: 13px;
      }
      74% {
        opacity: 0.8;
        transform: translateX(-70px) skewX(-2.5deg);
        height: 20px;
      }
      75% {
        opacity: 1;
        transform: translateX(35px) skewX(1deg);
        height: 10px;
      }
      76% {
        opacity: 0.5;
        transform: translateX(-90px) skewX(-1.5deg);
      }
      77% {
        opacity: 0;
        transform: translateX(0);
      }
    }
  </style>
</head>
<body>

  <!-- Page glitch ribbons -->
  <div class="glitch-strip glitch-strip-1" aria-hidden="true"></div>
  <div class="glitch-strip glitch-strip-2" aria-hidden="true"></div>

  <section class="hero">
    <div class="cyber-logo-wrap">
      <div class="sonar-cyber-text">SONAR</div>
    </div>

    <div class="tagline">
      SOund Neural Answer Retrieval<span class="cursor">&nbsp;</span>
    </div>

    <a href="/app" class="btn-enter">&#9658; ENTER SYSTEM</a>
  </section>

</body>
</html>
