<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SONAR</title>
  <meta name="theme-color" content="#00f0ff" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Orbitron', monospace;
      -webkit-font-smoothing: antialiased;
    }

    /* ── BG Canvas ── */
    #bg-canvas {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* ── Corner HUD brackets ── */
    .corner {
      position: fixed; width: 44px; height: 44px;
      pointer-events: none; z-index: 50; opacity: 0.6;
    }
    .c-tl { top:14px; left:14px;  border-top:2px solid #00f0ff; border-left:2px solid #00f0ff; }
    .c-tr { top:14px; right:14px; border-top:2px solid #00f0ff; border-right:2px solid #00f0ff; }
    .c-bl { bottom:14px; left:14px;  border-bottom:2px solid #00f0ff; border-left:2px solid #00f0ff; }
    .c-br { bottom:14px; right:14px; border-bottom:2px solid #00f0ff; border-right:2px solid #00f0ff; }

    /* ── Hero (centered) ── */
    .hero {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; gap: 0;
    }

    /* ── Spinning rings ── */
    .rings-wrapper {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
    }
    .ring {
      position: absolute; border-radius: 50%;
    }
    .ring-1 { width:480px; height:480px; border:1px solid rgba(0,240,255,0.08); animation:spin 25s linear infinite; }
    .ring-2 { width:420px; height:420px; border:1px dashed rgba(255,42,109,0.08); animation:spin 18s linear infinite reverse; }
    .ring-3 { width:360px; height:360px; border:1px dotted rgba(0,240,255,0.06); animation:spin 35s linear infinite; }
    .ring-4 { width:300px; height:300px; border:1px solid rgba(252,238,10,0.04); animation:spin 15s linear infinite reverse; }
    @keyframes spin { to { transform:rotate(360deg); } }

    /* ══════════════════════════════════════
       THE BIG SONAR WORD
    ══════════════════════════════════════ */
    .sonar-title {
      position: relative;
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: clamp(5rem, 20vw, 14rem);
      letter-spacing: 0.12em;
      color: #00f0ff;
      text-shadow:
        0 0 10px #00f0ff,
        0 0 30px #00f0ff,
        0 0 70px rgba(0,240,255,0.7),
        0 0 140px rgba(0,240,255,0.3),
        0 0 220px rgba(0,240,255,0.1);
      animation: breathe 4s ease-in-out infinite;
      user-select: none;
      z-index: 1;
    }
    @keyframes breathe {
      0%,100% {
        text-shadow:
          0 0 10px #00f0ff,
          0 0 30px #00f0ff,
          0 0 70px rgba(0,240,255,0.7),
          0 0 140px rgba(0,240,255,0.3),
          0 0 220px rgba(0,240,255,0.1);
      }
      50% {
        text-shadow:
          0 0 18px #00f0ff,
          0 0 50px #00f0ff,
          0 0 100px rgba(0,240,255,0.85),
          0 0 200px rgba(0,240,255,0.45),
          0 0 320px rgba(0,240,255,0.15);
        color: #33f5ff;
      }
    }

    /* Glitch layers */
    .sonar-title::before,
    .sonar-title::after {
      content: 'SONAR';
      position: absolute; top:0; left:0;
      width:100%; height:100%;
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: inherit;
      letter-spacing: inherit;
    }
    .sonar-title::before {
      color: #ff2a6d;
      text-shadow: 0 0 12px #ff2a6d;
      clip-path: inset(22% 0 55% 0);
      animation: glitch-r 5s infinite;
    }
    .sonar-title::after {
      color: #05ffa1;
      text-shadow: 0 0 12px #05ffa1;
      clip-path: inset(62% 0 8% 0);
      animation: glitch-g 5s infinite 0.35s;
    }
    @keyframes glitch-r {
      0%,84%,100% { opacity:0; transform:translate(0); }
      86% { opacity:1; transform:translateX(-6px) skewX(-1deg); }
      88% { opacity:1; transform:translateX(5px); }
      90% { opacity:0.7; transform:translateX(-3px); }
      92% { opacity:0; }
    }
    @keyframes glitch-g {
      0%,84%,100% { opacity:0; transform:translate(0); }
      87% { opacity:1; transform:translateX(7px) skewX(1deg); }
      89% { opacity:1; transform:translateX(-4px); }
      91% { opacity:0.7; transform:translateX(2px); }
      93% { opacity:0; }
    }

    /* ── Tagline ── */
    .tagline {
      font-family: 'Share Tech Mono', monospace;
      font-size: clamp(0.6rem, 2vw, 0.85rem);
      letter-spacing: 0.35em;
      color: rgba(0,240,255,0.45);
      margin-top: 10px;
      margin-bottom: 48px;
    }
    .cursor {
      display: inline-block; width: 1ch;
      background: rgba(0,240,255,0.6);
      animation: cur 1s steps(1) infinite;
    }
    @keyframes cur { 0%,100%{opacity:1} 50%{opacity:0} }

    /* ── Enter button ── */
    .btn-enter {
      display: inline-flex; align-items: center; gap: 10px;
      padding: 14px 44px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem; letter-spacing: 0.2em;
      color: #05050d;
      background: #00f0ff;
      text-decoration: none;
      clip-path: polygon(12px 0%, 100% 0%, calc(100% - 12px) 100%, 0% 100%);
      box-shadow: 0 0 20px #00f0ff, 0 0 50px rgba(0,240,255,0.4);
      transition: all 0.25s cubic-bezier(0.2,0,0,1);
      position: relative; overflow: hidden;
    }
    .btn-enter::before {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transform: translateX(-100%);
      transition: transform 0.5s;
    }
    .btn-enter:hover::before { transform: translateX(100%); }
    .btn-enter:hover {
      background: #33f5ff;
      box-shadow: 0 0 35px #00f0ff, 0 0 80px rgba(0,240,255,0.6);
      transform: translateY(-2px) scale(1.03);
    }
    .btn-enter:active { transform: translateY(0) scale(0.98); }

    /* ══════════════════════════════════════
       PAGE GLITCH STRIPS
       - 2 horizontal ribbons across the whole width
       - Use backdrop-filter invert + hue-rotate for OPPOSITE color
       - Fire at completely different times than the text glitch
    ══════════════════════════════════════ */
    .glitch-strip {
      position: fixed;
      left: -5%;
      width: 110%;
      pointer-events: none;
      z-index: 200;
      opacity: 0;
      /* Invert everything behind them → opposite colors to cyan text */
      backdrop-filter: invert(1) hue-rotate(160deg) saturate(3) brightness(1.4);
      -webkit-backdrop-filter: invert(1) hue-rotate(160deg) saturate(3) brightness(1.4);
      mix-blend-mode: screen;
    }

    /* Strip 1 — thicker, fires first */
    .glitch-strip-1 {
      top: 32%;
      height: 22px;
      animation: strip1 4.5s infinite 0.8s;
    }
    /* Strip 2 — thinner, fires after a gap */
    .glitch-strip-2 {
      top: 61%;
      height: 13px;
      animation: strip2 4.5s infinite 2.1s;
    }

    @keyframes strip1 {
      0%,78%,100% {
        opacity: 0;
        transform: translateX(0) skewX(0deg);
      }
      79% {
        opacity: 1;
        transform: translateX(-40px) skewX(-2deg);
        height: 22px;
      }
      80% {
        opacity: 0.9;
        transform: translateX(60px) skewX(1.5deg);
        height: 28px;
      }
      81% {
        opacity: 1;
        transform: translateX(-25px) skewX(-1deg);
        height: 18px;
      }
      82% {
        opacity: 0.6;
        transform: translateX(80px) skewX(2deg);
        height: 22px;
      }
      83% {
        opacity: 0;
        transform: translateX(0);
      }
    }

    @keyframes strip2 {
      0%,72%,100% {
        opacity: 0;
        transform: translateX(0) skewX(0deg);
      }
      73% {
        opacity: 1;
        transform: translateX(55px) skewX(2deg);
        height: 13px;
      }
      74% {
        opacity: 0.8;
        transform: translateX(-70px) skewX(-2.5deg);
        height: 20px;
      }
      75% {
        opacity: 1;
        transform: translateX(35px) skewX(1deg);
        height: 10px;
      }
      76% {
        opacity: 0.5;
        transform: translateX(-90px) skewX(-1.5deg);
      }
      77% {
        opacity: 0;
        transform: translateX(0);
      }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .ring-1, .ring-2 { width:280px; height:280px; }
      .ring-3, .ring-4 { display:none; }
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="corner c-tl"></div>
  <div class="corner c-tr"></div>
  <div class="corner c-bl"></div>
  <div class="corner c-br"></div>

  <!-- Page glitch ribbons — fire at different time from text glitch -->
  <div class="glitch-strip glitch-strip-1" aria-hidden="true"></div>
  <div class="glitch-strip glitch-strip-2" aria-hidden="true"></div>

  <section class="hero">
    <div class="rings-wrapper">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="ring ring-4"></div>
    </div>

    <div class="sonar-title">SONAR</div>

    <div class="tagline">
      SOund Neural Answer Retrieval<span class="cursor">&nbsp;</span>
    </div>

    <a href="/app" class="btn-enter">&#9658; ENTER SYSTEM</a>
  </section>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, particles = [];

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    class Particle {
      constructor() { this.reset(true); }
      reset(rand) {
        this.x  = Math.random() * W;
        this.y  = rand ? Math.random() * H : H + 10;
        this.vx = (Math.random() - 0.5) * 0.3;
        this.vy = -(Math.random() * 0.5 + 0.1);
        this.r  = Math.random() * 1.5 + 0.3;
        this.alpha = Math.random() * 0.5 + 0.1;
        const roll = Math.random();
        this.color = roll > 0.6 ? '#00f0ff' : roll > 0.3 ? '#ff2a6d' : '#05ffa1';
      }
      update() {
        this.x += this.vx; this.y += this.vy;
        if (this.y < -10 || this.x < -10 || this.x > W + 10) this.reset(false);
      }
      draw() {
        ctx.save();
        ctx.globalAlpha = this.alpha;
        ctx.fillStyle = this.color;
        ctx.shadowColor = this.color;
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    for (let i = 0; i < 120; i++) particles.push(new Particle());

    let t = 0;
    function draw() {
      requestAnimationFrame(draw);
      t += 0.004;

      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.fillRect(0, 0, W, H);

      // Center glow only (no grid)
      const cx = W/2, cy = H/2;
      const g = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(W,H)*0.5);
      g.addColorStop(0, `rgba(0,240,255,${0.025+Math.sin(t)*0.01})`);
      g.addColorStop(0.5, `rgba(255,42,109,${0.01+Math.sin(t+1)*0.005})`);
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);

      particles.forEach(p => { p.update(); p.draw(); });

      // Glitch streaks
      if (Math.random() < 0.008) {
        ctx.fillStyle = `rgba(0,240,255,${Math.random()*0.06})`;
        ctx.fillRect(0, Math.random()*H, Math.random()*200+50, Math.random()*2+1);
      }
    }
    draw();
  </script>
</body>
</html>
