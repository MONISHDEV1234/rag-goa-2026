<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SONAR — SOund Neural Answer Retrieval</title>
  <meta name="description" content="SONAR: SOund Neural Answer Retrieval. Voice-enabled RAG with MSMARCO-XI, Sarvam AI, FAISS, and Groq LLM." />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%; width: 100%;
      overflow: hidden;
      background: #000000;
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Volumetric Prism Lighting / Horizon Glow ── */
    .prism-background {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    /* Upward light cone */
    .prism-cone {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 75vw;
      max-width: 1050px;
      height: 70vh;
      background: conic-gradient(
        from 180deg at 50% 100%,
        rgba(0, 240, 255, 0) 0deg,
        rgba(0, 180, 255, 0.08) 25deg,
        rgba(255, 42, 109, 0.06) 45deg,
        rgba(252, 238, 10, 0.05) 55deg,
        rgba(5, 255, 161, 0.08) 70deg,
        rgba(0, 240, 255, 0.12) 85deg,
        rgba(0, 240, 255, 0) 100deg
      );
      filter: blur(55px);
      opacity: 0.85;
      animation: cone-pulse 8s ease-in-out infinite alternate;
    }

    /* Horizon floor light flare */
    .prism-horizon {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 28vh;
      background: radial-gradient(
        ellipse 70% 80% at 50% 100%,
        rgba(255, 255, 255, 0.85) 0%,
        rgba(0, 240, 255, 0.8) 18%,
        rgba(0, 130, 255, 0.45) 42%,
        rgba(255, 42, 109, 0.15) 65%,
        transparent 85%
      );
      filter: blur(35px);
      opacity: 0.95;
    }

    /* Ambient top glow */
    .prism-ambient {
      position: absolute;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      height: 50vh;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.06) 0%, rgba(255, 42, 109, 0.03) 40%, transparent 70%);
      filter: blur(70px);
    }

    @keyframes cone-pulse {
      0% { opacity: 0.75; transform: translateX(-50%) scale(0.96); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.04); }
    }

    /* ── App Shell ── */
    .page-container {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 48px 24px;
    }

    /* ── Top Header Navigation ── */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 1300px;
      margin: 0 auto;
    }

    .brand-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: 1.15rem;
      letter-spacing: 0.28em;
      color: #ffffff;
      text-decoration: none;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }
    .brand-logo:hover { opacity: 0.8; }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 32px;
    }

    .nav-link {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      color: rgba(255, 255, 255, 0.65);
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.2s;
    }
    .nav-link:hover {
      color: #ffffff;
    }

    .nav-pill-btn {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 9px 24px;
      text-decoration: none;
      text-transform: uppercase;
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
      backdrop-filter: blur(12px);
    }
    .nav-pill-btn:hover {
      background: #ffffff;
      color: #000000;
      border-color: #ffffff;
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    /* ── Center Hero ── */
    .hero-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: auto 0;
      user-select: none;
    }

    .hero-title {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 900;
      font-size: clamp(5.5rem, 18vw, 13.5rem);
      letter-spacing: 0.18em;
      line-height: 1;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow:
        0 0 20px rgba(255, 255, 255, 0.7),
        0 0 50px rgba(255, 255, 255, 0.4),
        0 0 90px rgba(0, 240, 255, 0.35);
      margin-left: 0.18em; /* optical alignment for letter spacing */
    }

    .hero-subtitle {
      font-family: 'Space Mono', monospace;
      font-size: clamp(0.7rem, 1.4vw, 0.92rem);
      font-weight: 400;
      letter-spacing: 0.32em;
      color: rgba(255, 255, 255, 0.55);
      text-transform: uppercase;
      margin-top: 18px;
    }

    /* ── Footer ── */
    .footer {
      width: 100%;
      text-align: center;
      padding-top: 8px;
    }

    .footer-text {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.75rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.4);
      letter-spacing: 0.05em;
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .page-container { padding: 20px 24px; }
      .nav-actions { gap: 18px; }
      .hero-subtitle { letter-spacing: 0.2em; }
    }
  </style>
</head>
<body>

  <!-- Volumetric Prism Light Effect Background -->
  <div class="prism-background" aria-hidden="true">
    <div class="prism-ambient"></div>
    <div class="prism-cone"></div>
    <div class="prism-horizon"></div>
  </div>

  <div class="page-container">

    <!-- Top Navigation Bar -->
    <header class="navbar">
      <a href="/" class="brand-logo">SONAR</a>
      <nav class="nav-actions">
        <a href="/about" class="nav-link">ABOUT</a>
        <a href="/tutorial" class="nav-link">TUTORIAL</a>
        <a href="/app" class="nav-pill-btn">LAUNCH APP</a>
      </nav>
    </header>

    <!-- Center Brand Showcase -->
    <main class="hero-center">
      <h1 class="hero-title">SONAR</h1>
      <p class="hero-subtitle">SOund Neural Answer Retrieval</p>
    </main>

    <!-- Bottom Footer -->
    <footer class="footer">
      <p class="footer-text">&copy; 2026 SONAR &mdash; SOund Neural Answer Retrieval. HH Goa 2026 Task 2.</p>
    </footer>

  </div>

</body>
</html>
