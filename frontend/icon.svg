<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f1117"/>
      <stop offset="100%" stop-color="#090a0f"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="#6366f1" stroke-opacity="0.3" stroke-width="8"/>
  
  <!-- Outer Glow Pulse Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="url(#glowGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.6"/>
  <circle cx="256" cy="230" r="110" fill="#1a1d2e" stroke="url(#glowGrad)" stroke-width="6" filter="url(#glow)"/>
  
  <!-- Microphone Body -->
  <rect x="220" y="150" width="72" height="130" rx="36" fill="url(#glowGrad)"/>
  <!-- Microphone Stand / Arc -->
  <path d="M180 220 C 180 300, 332 300, 332 220" fill="none" stroke="#e0e7ff" stroke-width="18" stroke-linecap="round"/>
  <!-- Stand Stem -->
  <line x1="256" y1="300" x2="256" y2="350" stroke="#e0e7ff" stroke-width="18" stroke-linecap="round"/>
  <!-- Stand Base -->
  <line x1="200" y1="350" x2="312" y2="350" stroke="#e0e7ff" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Audio wave dots -->
  <circle cx="130" cy="230" r="10" fill="#818cf8"/>
  <circle cx="100" cy="230" r="6" fill="#6366f1" opacity="0.7"/>
  <circle cx="382" cy="230" r="10" fill="#818cf8"/>
  <circle cx="412" cy="230" r="6" fill="#6366f1" opacity="0.7"/>
  
  <!-- Bottom Text Label -->
  <text x="256" y="435" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="4">HH GOA RAG</text>
</svg>
